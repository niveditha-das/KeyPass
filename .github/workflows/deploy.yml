name: deploy

# Builds the server image, pushes it to ECR, and rolls the EC2 instance to it via SSM Run Command.
# Manual only. AWS access is through OIDC (no stored keys); the role only trusts jobs running in
# the `production` environment, so add required reviewers there to gate deploys.
#
# Environment variables to set on the `production` environment (from `terraform output`):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY, EC2_INSTANCE_ID
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.uri }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        run: docker push "${{ steps.image.outputs.uri }}"

      - name: Roll out on EC2
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "keypass deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"/opt/keypass/deploy/deploy.sh ${GITHUB_SHA} ${IMAGE}\"],executionTimeout=[\"900\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          # `aws ssm wait` gives up after 100 s, too short for an image pull plus a JVM start.
          for _ in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]
