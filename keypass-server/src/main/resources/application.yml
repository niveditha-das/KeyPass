spring:
  application:
    name: keypass-server
  datasource:
    url: jdbc:postgresql://localhost:5432/keypass
    username: keypass
    password: ${DB_PASSWORD:keypass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

keypass:
  signing-key: ${KEYPASS_SIGNING_KEY:}
  signing-public-key: ${KEYPASS_SIGNING_PUBLIC_KEY:}
  signing-key-id: ${KEYPASS_SIGNING_KID:kid-dev-1}
  jwt:
    issuer: keypass-server
    access-token-ttl-minutes: 15

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
